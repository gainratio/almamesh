name: Dagger

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a PR cancels that PR's superseded run. Main runs never cancel:
# every merge to main finishes its Dagger run, so every merge can deploy. Each
# main run gets its own group, because a shared group keeps only one pending
# run and a third stacked merge would cancel the pending second one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Each gate of the Dagger module's `ci` runs as its own job on its own runner
# (`dagger call gate --name=<gate>`), so the run takes as long as the slowest
# gate instead of every gate sharing one 4 vCPU runner. `dagger call ci` runs
# the same gates in one engine; dagger/src/gates.ts lists them (CI_GATES), and
# tests/dagger-workflow-contract.test.ts holds this file to that list.
#
# The browser toolchain image (ghcr.io/gainratio/almamesh-toolchain) is a
# private package. Each gate job reads it with its own GITHUB_TOKEN
# (packages:read), handed to the module as a Dagger Secret (`env:`), so the
# value is never printed. A fork PR's token may be unable to read it, which
# fails that gate red rather than skipping it; every external contributor's
# run already waits for a maintainer's approval (fork-pr-contributor-approval:
# all_external_contributors).

jobs:
  secret-scan:
    name: gate / secretScan
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read # Pull the private ghcr.io toolchain image.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: "0.21.8"
          call: --registry-token=env:GITHUB_TOKEN gate --name=secretScan --commit-sha=${{ github.sha }} --repository=${{ github.repository }}

  contracts:
