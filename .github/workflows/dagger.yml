        with:
          version: "0.21.8"
          call: --registry-token=env:GITHUB_TOKEN gate --name=browserChromium --commit-sha=${{ github.sha }} --repository=${{ github.repository }}

  # Fleet rules shell-step / candidate-order / artifact-identity (gainratio/ci):
  # a job is checkout -> Dagger, or checkout -> Dagger -> upload of SHA-bound
  # bytes. The browser journeys run in three lanes (dagger/src/journeyLanes.ts),
  # each ONCE, in its own evidence job; the scanned snapshot (with the original
  # exit status in its receipt) is uploaded even when a journey failed. Each
  # lane's gate job reads its own receipt back, and fails closed without one.
  browser-journeys-a-evidence:
    name: evidence / browserJourneysA
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read # Pull the private ghcr.io toolchain image.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          # Engine config: pull Docker Hub images via the GHCR mirror (.github/xdg/dagger/engine.json).
          XDG_CONFIG_HOME: ${{ github.workspace }}/.github/xdg
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: "0.21.8"
          call: --registry-token=env:GITHUB_TOKEN browser-journeys-evidence --lane=a --commit-sha=${{ github.sha }} --repository=${{ github.repository }} export --path=candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-journeys-evidence-a-${{ github.sha }}
          path: candidate
          retention-days: 1
          if-no-files-found: error

  # The browserJourneysA gate: Dagger reads this run's lane-a receipt back and
  # exits with the journeys' original status. It runs even if the evidence job
  # failed, and then fails closed (no receipt), so a red journey is a red Dagger check.
  browser-journeys-a:
    name: gate / browserJourneysA
    needs: [browser-journeys-a-evidence]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # Read this run's evidence artifact.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          # Engine config: pull Docker Hub images via the GHCR mirror (.github/xdg/dagger/engine.json).
          XDG_CONFIG_HOME: ${{ github.workspace }}/.github/xdg
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: "0.21.8"
          call: browser-journeys-status --lane=a --github-token=env:GITHUB_TOKEN --commit-sha=${{ github.sha }} --repository=${{ github.repository }} --run-id=${{ github.run_id }}

  browser-journeys-b-evidence:
    name: evidence / browserJourneysB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read # Pull the private ghcr.io toolchain image.
