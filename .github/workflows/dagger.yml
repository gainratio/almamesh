    name: Dagger
    needs: [secret-scan, contracts, browser-chromium, browser-journeys, browser-suites, browser-wizards, browser-webkit-real, browser-matrix, frontend, backend, pdf, privacy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.8"
          call: verdict --results="${{ join(needs.*.result, ',') }}"
