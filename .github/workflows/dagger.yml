  # The one required check (branch protection and the deploy's green-main
  # proof both read the check named Dagger). `!cancelled()` makes it run and go
  # red when a gate fails: a failed need would otherwise SKIP it, and a skipped
  # required check counts as passing.
  dagger:
    name: Dagger
    needs: [secret-scan, contracts, browser-chromium, browser-journeys-a, browser-journeys-b, browser-journeys-c, browser-suites, browser-wizards, browser-webkit-real, browser-matrix, frontend, backend, pdf, privacy]
