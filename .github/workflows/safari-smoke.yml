name: Safari (macOS)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# A deploy gate with Dagger: real Safari through Apple's safaridriver, where
# every other WebKit check runs Playwright's bundled WebKit build. Deploy
# acceptance (dagger/src/nativeMacAcceptance.ts) waits for this workflow to be
# green for the SHA, and its completion re-triggers a deploy (deploy.yml). The
# macOS WebKit lane (webkit-macos.yml) only reports. Evidence is uploaded only
# after its secret scan.

jobs:
  safari-smoke:
    name: safari / macOS smoke
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/.bun-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: bun install --frozen-lockfile
      - run: sudo safaridriver --enable
      - run: bash scripts/setup-dev-assets.sh
      - run: node scripts/safari-smoke.mjs
      - id: leak-scan
        if: always()
        run: node scripts/artifactLeakScan.mjs safari-smoke-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.leak-scan.outcome == 'success'
        with:
          name: safari-smoke-evidence
          path: frontend/apps/web/safari-smoke-evidence
          retention-days: 14
          if-no-files-found: error
