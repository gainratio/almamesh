name: WebKit (macOS)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Linux WebKit cannot boot the nested-Worker OPFS engine. Keep native memory,
# travel and portable/boot acceptance independent, each with a 45-minute bound.
# The stable acceptance check below succeeds only if all three passed.
# Upload only a finalized evidence snapshot after its secret scan.

jobs:
  webkit-memory:
    name: webkit / macOS memory
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend/apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/.bun-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: bun install --frozen-lockfile
      - run: bash scripts/webkit-macos-lane.sh memory
      - id: collect-native-evidence
        if: always()
        timeout-minutes: 2
        run: bash scripts/webkit-macos-lane.sh --collect-native-evidence memory
      - id: finalize-evidence
        if: always()
        run: bash scripts/webkit-macos-lane.sh --finalize-evidence memory
      - id: leak-scan
        if: always() && steps.finalize-evidence.outcome == 'success'
        run: node scripts/artifactLeakScan.mjs webkit-lane-evidence-memory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.leak-scan.outcome == 'success'
        with:
          name: webkit-lane-memory-evidence
          path: frontend/apps/web/webkit-lane-evidence-memory
          retention-days: 14
          if-no-files-found: error

  webkit-travel:
    name: webkit / macOS time travel
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend/apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/.bun-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: bun install --frozen-lockfile
      - run: bash scripts/webkit-macos-lane.sh travel
      - id: collect-native-evidence
        if: always()
        timeout-minutes: 2
        run: bash scripts/webkit-macos-lane.sh --collect-native-evidence travel
      - id: finalize-evidence
        if: always()
        run: bash scripts/webkit-macos-lane.sh --finalize-evidence travel
      - id: leak-scan
        if: always() && steps.finalize-evidence.outcome == 'success'
        run: node scripts/artifactLeakScan.mjs webkit-lane-evidence-travel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.leak-scan.outcome == 'success'
        with:
          name: webkit-lane-travel-evidence
          path: frontend/apps/web/webkit-lane-evidence-travel
          retention-days: 14
          if-no-files-found: error

  webkit-portable:
    name: webkit / macOS export-import + boot recovery
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend/apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/.bun-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: bun install --frozen-lockfile
      - run: bash scripts/webkit-macos-lane.sh portable
      - id: collect-native-evidence
        if: always()
        timeout-minutes: 2
        run: bash scripts/webkit-macos-lane.sh --collect-native-evidence portable
      - id: finalize-evidence
        if: always()
        run: bash scripts/webkit-macos-lane.sh --finalize-evidence portable
      - id: leak-scan
        if: always() && steps.finalize-evidence.outcome == 'success'
        run: node scripts/artifactLeakScan.mjs webkit-lane-evidence-portable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.leak-scan.outcome == 'success'
        with:
          name: webkit-lane-portable-evidence
          path: frontend/apps/web/webkit-lane-evidence-portable
          retention-days: 14
          if-no-files-found: error

  webkit-macos:
    name: webkit / macOS time travel + export-import
    needs: [webkit-memory, webkit-travel, webkit-portable]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          MEMORY_RESULT: ${{ needs.webkit-memory.result }}
          TRAVEL_RESULT: ${{ needs.webkit-travel.result }}
          PORTABLE_RESULT: ${{ needs.webkit-portable.result }}
        run: test "$MEMORY_RESULT" = success && test "$TRAVEL_RESULT" = success && test "$PORTABLE_RESULT" = success
