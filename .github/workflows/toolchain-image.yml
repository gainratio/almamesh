name: Toolchain image

# Builds the prebuilt browser toolchain (apt packages, Bun, Playwright browsers)
# and pushes it to ghcr.io/<owner>/almamesh-toolchain, where <owner> is this
# run's own github.repository_owner, lowercased. publish-toolchain refuses any
# repository outside the allow-list (hseshadr/almamesh, gainratio/almamesh), so
# a fork cannot publish. The gates only use the image once a PR pins its digest
# in dagger/src/toolchain.ts; until then they install inline. Runs when the
# recipe or the locked Playwright version can change, or on manual dispatch
# (the first publish under a new owner after a repository transfer).
on:
  push:
    branches: [main]
    paths:
      - dagger/src/toolchain.ts
      - frontend/bun.lock
      - .github/workflows/toolchain-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publish toolchain image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Push ghcr.io/<owner>/almamesh-toolchain.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          # Engine config: pull Docker Hub images via the GHCR mirror (.github/xdg/dagger/engine.json).
          XDG_CONFIG_HOME: ${{ github.workspace }}/.github/xdg
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: "0.21.8"
          call: publish-toolchain --github-token=env:GITHUB_TOKEN --repository=${{ github.repository }} --repository-owner=${{ github.repository_owner }}
