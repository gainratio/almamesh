name: Toolchain image

# Builds the prebuilt browser toolchain (apt packages, Bun, Playwright browsers)
# and pushes it to ghcr.io/hseshadr/almamesh-toolchain. The gates only use it
# once a PR pins its digest in dagger/src/toolchain.ts; until then they install
# inline. Runs when the recipe or the locked Playwright version can change.
on:
  push:
    branches: [main]
    paths:
      - dagger/src/toolchain.ts
      - frontend/bun.lock
      - .github/workflows/toolchain-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publish toolchain image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Push ghcr.io/hseshadr/almamesh-toolchain.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: "0.21.8"
          call: publish-toolchain --github-token=env:GITHUB_TOKEN
