name: Nightly E2E (all Playwright specs)

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nightly-e2e:
    name: All Playwright flow specs (Dagger)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          # Engine config: pull Docker Hub images via the GHCR mirror (.github/xdg/dagger/engine.json).
          XDG_CONFIG_HOME: ${{ github.workspace }}/.github/xdg
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          version: "0.21.8"
          verb: call
          args: nightly --openrouter-api-key=env:OPENROUTER_API_KEY sync
