# Weekly grouped dependency PRs (ENGINEERING-STANDARDS §4, Published tier).
# Our own `@gainratio/*` libraries come from npm and must track their newest
# release, so they get their own DAILY job (below) that opens a bump PR right
# after each release; the weekly frontend group ignores them. `edge-proc`
# resolves from PyPI and rides the `uv` group below.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Python engine + bundle publisher (uv.lock).
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Bun workspace (bun.lock) — dependabot's bun ecosystem.
  - package-ecosystem: "bun"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@gainratio/*"

  # Own libraries, daily and separate from everything else. Dependabot rejects
  # two jobs with the same ecosystem + directory + target-branch, so this one
  # names `target-branch: main` explicitly to be a distinct job on the same branch.
  - package-ecosystem: "bun"
    directory: "/frontend"
    target-branch: "main"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "@gainratio/*"
    groups:
      gainratio:
        patterns: ["@gainratio/*"]
