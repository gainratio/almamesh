# Retrodiction eval: a template with FAKE data. Copy it OUTSIDE the repo, then edit:
#
#   mkdir -p ~/.almamesh/retrodiction
#   cp examples/retrodiction/events.example.yaml ~/.almamesh/retrodiction/events.yaml
#   cd backend && uv run almamesh-eval retrodiction --events ~/.almamesh/retrodiction/events.yaml
#
# Change `kind` to personal for your own data. The loader refuses a personal file that
# sits inside any git working tree, and writes its report next to the file.
kind: synthetic                  # personal | public | synthetic (this template is fake)
label: example (fake native)
source: made up for the template

subjects:
  - id: me
    # Birth date and time WITH the birthplace's UTC offset at birth, plus coordinates
    # (copy them from the app's profile settings).
    birth: {datetime: "1984-07-02T05:40:00+05:30", latitude: 13.08, longitude: 80.27}
    events:
      # category: career_change, job_start, job_loss, legal, relationship_start, marriage,
      #   separation, relocation, health, accident, birth_of_child, death_in_family,
      #   financial_gain, financial_loss, education
      # date: YYYY-MM-DD (precision: day), YYYY-MM (month) or YYYY (year; listed as excluded)
      - {category: job_start, date: "2019-05", precision: month, place: Singapore}
      - {category: legal, date: "2019-09-12", precision: day, place: Singapore}
      - {category: relocation, date: "2016-01", precision: month, place: Bengaluru}
      - {category: education, date: "2006", precision: year}
