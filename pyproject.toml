[project]
name = "almamesh-workspace"
version = "0"
description = "Repo-root task runner for the AlmaMesh browser demo (not a package)."
requires-python = ">=3.13"
dependencies = ["poethepoet>=0.30"]

[tool.uv]
package = false                 # virtual project: uv won't build/install a root package

[tool.poe.tasks.frontend-install]
help = "Install the frontend workspace deps (bun)"
shell = "cd frontend && bun install"

[tool.poe.tasks.dev-assets]
help = "Fetch Pyodide dist + sign the dev bundle (rebuilds when backend/src/almamesh changes)"
shell = """
if [ -f frontend/apps/web/public/bundle/latest ] && [ -d frontend/apps/web/public/pyodide ] && [ -z "$(find backend/src/almamesh -type f -newer frontend/apps/web/public/bundle/latest 2>/dev/null)" ]; then
  echo '==> Dev assets already present and up to date — skipping (run: uv run poe dev-assets-fresh to rebuild)'
else
  bash frontend/apps/web/scripts/setup-dev-assets.sh
fi
"""

[tool.poe.tasks.dev-assets-fresh]
help = "Force re-fetch Pyodide dist + re-sign the dev bundle"
shell = "bash frontend/apps/web/scripts/setup-dev-assets.sh"

[tool.poe.tasks.frontend-build]
help = "Production build of the web app (module Workers only resolve in a build, not vite dev)"
shell = "cd frontend/apps/web && bun run build"

[tool.poe.tasks.frontend-preview]
help = "Serve the build and open the browser demo (http://localhost:4173)"
shell = "cd frontend/apps/web && bun run preview --open"

[tool.poe.tasks.demo]
help = "Turnkey: install -> fetch/sign assets -> build -> open the browser demo"
sequence = [
  { ref = "frontend-install" },
  { ref = "dev-assets" },
  { ref = "frontend-build" },
  { ref = "frontend-preview" },
]

[tool.poe.tasks.demo-fresh]
help = "Like demo, but force-rebuilds the dev bundle first"
sequence = [
  { ref = "frontend-install" },
  { ref = "dev-assets-fresh" },
  { ref = "frontend-build" },
  { ref = "frontend-preview" },
]

# ---- The gate (ENGINEERING-STANDARDS §3: dual-stack = `make gate`) ----------
# One canonical quality gate for the whole repo. CI's backend/frontend jobs run
# exactly the two sub-commands below — the gate and CI mirror, both directions.

[tool.poe.tasks.gate-backend]
help = "Backend gate: ruff lint+format, mypy strict, xenon, pytest (cov >= floor), vendored edge-proc suite"
shell = "cd backend && env -u VIRTUAL_ENV uv run poe gate"

[tool.poe.tasks.gate-frontend]
help = "Frontend gate: declarations build, typecheck, lint, unit tests, build"
shell = "cd frontend && bun run gate"

[tool.poe.tasks.gate]
help = "Full dual-stack quality gate (backend + frontend) — run before every commit"
sequence = [{ ref = "gate-backend" }, { ref = "gate-frontend" }]
